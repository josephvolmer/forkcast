name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: macos-15            # Apple Silicon
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0         # tags, for the version number

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build and smoke-test the CLI and docs
        run: make check
