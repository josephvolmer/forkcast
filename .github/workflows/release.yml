name: Release

# Publish a release:   git tag v2.1.0 && git push origin v2.1.0
# Or from the Actions tab: "Run workflow" with a version (creates the tag), or leave it empty for a
# test build that is uploaded as a workflow artifact but not published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 2.1.0 (empty = test build, not published)'
        required: false
        default: ''

permissions:
  contents: write                # create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15            # Apple Silicon, which Forkcast requires
    env:
      # Optional Developer ID signing + notarization: add these repository secrets to enable it.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"; PUBLISH=true
          elif [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"; PUBLISH=true
          else
            V="0.0.0-test.${GITHUB_RUN_NUMBER}"; PUBLISH=false
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?([-.][0-9A-Za-z.]+)?$'; then
            echo "::error::'$V' is not a valid version (expected e.g. 2.1.0)"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $V (publish: $PUBLISH)"

      - name: Build and check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make check VERSION="$VERSION"

      - name: Sign with Developer ID and notarize
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}          # e.g. "Developer ID Application: Name (TEAMID)"
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW=$(openssl rand -hex 16)
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          APP=build/Forkcast.app
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP/Contents/Helpers/forkcast"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$APP"

      - name: Build installer package (.pkg)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make pkg VERSION="$VERSION"

      - name: Sign and notarize the installer package
        if: env.HAS_SIGNING == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}      # e.g. "Developer ID Installer: Name (TEAMID)"
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          PKG="build/Forkcast-$VERSION.pkg"
          productsign --sign "$INSTALLER_IDENTITY" "$PKG" "$PKG.signed" && mv "$PKG.signed" "$PKG"
          xcrun notarytool submit "$PKG" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$PKG"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NAME="Forkcast-$VERSION-macos-arm64"
          cp "build/Forkcast-$VERSION.pkg" "dist-pkg.tmp"
          mkdir -p "dist/$NAME"
          mv dist-pkg.tmp "dist/$NAME.pkg"
          ditto build/Forkcast.app "dist/$NAME/Forkcast.app"
          cp scripts/install.sh LICENSE "dist/$NAME/"
          chmod +x "dist/$NAME/install.sh"
          (cd dist && ditto -c -k --keepParent "$NAME" "$NAME.zip" && shasum -a 256 "$NAME.pkg" "$NAME.zip" > SHA256SUMS.txt)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.pkg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if [ "$HAS_SIGNING" = "true" ]; then
            SIGNED="Signed with a Developer ID and notarized by Apple."
          else
            SIGNED="This build isn't notarized (no Apple Developer ID yet), so macOS will say it can't verify the installer: right-click the .pkg → **Open**, or open it, then go to **System Settings › Privacy & Security** and click **Open Anyway**."
          fi
          cat > notes.md <<NOTES
          ## Install

          Requires macOS 14+ on Apple Silicon.

          **Installer (recommended):** download **$NAME.pkg** and double-click it. It installs \`/Applications/Forkcast.app\`, the \`forkcast\` command in \`/usr/local/bin\` and its man page, then starts the app (a fork appears in the menu bar). The local API is part of the app — nothing else to install.

          $SIGNED

          **Without admin rights:** download **$NAME.zip**, unzip it and run \`sh install.sh\` from the unzipped folder (installs the CLI into \`~/.local/bin\`).

          Verify downloads: \`shasum -a 256 -c SHA256SUMS.txt\`

          NOTES
          sed -i '' 's/^          //' notes.md
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "dist/$NAME.pkg" "dist/$NAME.zip" dist/SHA256SUMS.txt \
            --title "Forkcast $VERSION" --notes-file notes.md --generate-notes \
            --target "$GITHUB_SHA" $PRERELEASE
